name: Build Quiz Bank APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Release signing key: configured" | tee build.log
          else
            echo "Release signing key: MISSING (add the KEYSTORE_PASSWORD secret); using a temporary debug key" | tee build.log
          fi
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee -a build.log

      - name: Collect APK
        id: collect
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p out
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            NAME="QuizBank-v${VERSION}.apk"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            NAME="QuizBank-v${VERSION}-TEST-debugkey.apk"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          cp app/build/outputs/apk/release/app-release.apk "out/${NAME}"
          sha256sum "out/${NAME}" | tee -a build.log
          ls -la out

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.collect.outputs.prerelease }}" = "true" ]; then
            NOTES="Test build signed with a temporary key. Add the KEYSTORE_PASSWORD secret before installing."
            gh release create "v${VERSION}" out/*.apk build.log --target "${GITHUB_SHA}" \
              --title "Quiz Bank v${VERSION} (test)" --notes "${NOTES}" --prerelease
          else
            NOTES="Download the .apk file below and open it on your phone to install or update Quiz Bank."
            gh release create "v${VERSION}" out/*.apk build.log --target "${GITHUB_SHA}" \
              --title "Quiz Bank v${VERSION}" --notes "${NOTES}" --latest
          fi

      - name: Publish build log after a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f build.log ] || echo "No build log was produced." > build.log
          gh release delete build-failure-log --yes --cleanup-tag || true
          gh release create build-failure-log build.log --target "${GITHUB_SHA}" --prerelease \
            --title "Build failure log (run ${{ github.run_number }})" \
            --notes "Log of the most recent failed build. Safe to ignore."
